name: Seed history
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seed:
    if: contains(github.event.head_commit.message, 'bootstrap bundle for history import') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Import original main history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          urls=(
            https://d.uguu.se/AdcLwlJz.bundle
            https://filebin.net/f4c890755bee851c/xg.bundle
            https://litter.catbox.moe/asznsy.bundle
          )
          ok=0
          for url in "${urls[@]}"; do
            echo "Trying $url"
            if curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' -o /tmp/xg.bundle "$url"; then
              if git bundle verify /tmp/xg.bundle; then
                ok=1
                break
              fi
            fi
            echo "URL failed: $url"
          done
          test "$ok" = 1
          rm -rf /tmp/src
          git clone /tmp/xg.bundle /tmp/src
          cd /tmp/src
          git checkout main
          echo "Imported HEAD=$(git rev-parse HEAD)"
          git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force github HEAD:refs/heads/main
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description='Open-source interactive genealogy of Chinese xiangsheng (crosstalk) masters — lineages, teacher–disciple ties, eras — for research and fans.' || true
          printf '%s' '{"names":["xiangsheng","crosstalk","chinese-comedy","genealogy","visualization","threejs","react","open-data","cultural-heritage","ink-wash"]}' \
            | gh api -X PUT "repos/${GITHUB_REPOSITORY}/topics" -H "Accept: application/vnd.github+json" --input - || true
